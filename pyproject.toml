[project]
name = "biocutils"
dynamic = [
    "version",
]
description = "Utilities to use across the biocpy packages."
readme = "README.md"
authors = [
    { name = "Jayaram Kancherla", email = "jayaram.kancherla@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "importlib-metadata>=9.0.0 ; python_full_version < '3.8'",
    "numpy>=2.5.2",
]

[project.optional-dependencies]
testing = [
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "scipy>=1.18.1",
    "setuptools>=84.0.0",
]

[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.ruff]
line-length = 120
src = [
    "src",
]
exclude = [
    "tests",
    "docs",
]

[tool.ruff.lint]
extend-ignore = [
    "F821",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "E402",
    "F401",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 20

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report term-missing"
testpaths = [
    "tests",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "sphinx",
    "myst-nb",
    "furo",
    "sphinx-autodoc-typehints",
    "linkify-it-py",
    "mypy",
]
